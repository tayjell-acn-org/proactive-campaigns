# CI/CD pipeline for the Bill Variance Domain Function App.
# Placeholder GitHub Actions workflow (TDD Section 12). Adjust the trigger
# path, Python version, resource names, and auth to your approved standards.

name: bill-variance-domain

on:
  push:
    branches: [main]
    paths:
      - "bill_variance_domain/**"
      - "shared_packages/**"
      - "pipelines/bill_variance_domain.yml"
  workflow_dispatch: {}

env:
  PYTHON_VERSION: "3.11"
  FUNCTION_APP_NAME: "<bill-variance-function-app-name>"
  PACKAGE_ROOT: "bill_variance_domain"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ env.PACKAGE_ROOT }}/requirements.txt
          pip install pytest

      - name: Run unit tests
        working-directory: ${{ env.PACKAGE_ROOT }}
        run: pytest tests/unit -q

      # Bundle shared_packages alongside the domain app so imports resolve
      # in the deployed Function App.
      - name: Assemble deployment package
        run: |
          mkdir -p deploy
          cp -r ${{ env.PACKAGE_ROOT }}/* deploy/
          cp -r shared_packages deploy/shared_packages

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bill-variance-domain
          path: deploy

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: NON-PROD
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: bill-variance-domain
          path: deploy

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: deploy
